definitions:
  BaseResponse:
    type: "object"
    required:
      - "code"
      - "message"
    properties:
      code:
        type: "integer"
        format: "int32"
        example: 0
        description: "响应代码，0 表示成功"
      message:
        type: "string"
        example: "success"
        description: "响应消息"
  SuccessResponse:
    allOf:
      - $ref: "#/definitions/BaseResponse"
      - type: "object"
        properties:
          data:
            type: "object"
            additionalProperties: false
            description: "成功响应数据"
  ErrorResponse:
    type: "object"
    required:
      - "code"
      - "message"
    properties:
      code:
        type: "integer"
        format: "int32"
        example: 1001
        description: "错误代码"
      message:
        type: "string"
        example: "forbidden"
        description: "错误消息"
  ValidationErrorItem:
    type: "object"
    properties:
      field:
        type: "string"
        description: "字段名"
      reason:
        type: "string"
        description: "错误原因"
  ValidationErrorResponse:
    allOf:
      - $ref: "#/definitions/ErrorResponse"
      - type: "object"
        properties:
          errors:
            type: "array"
            items:
              $ref: "#/definitions/ValidationErrorItem"
            description: "验证错误列表"
  Role:
    type: "object"
    required:
      - "id"
      - "role_name"
    properties:
      id:
        type: "integer"
        format: "int64"
        example: 1
        description: "角色 ID"
      role_name:
        type: "string"
        enum:
          - "sales"
          - "consultant"
          - "admin"
          - "super_admin"
        example: "sales"
        description: "角色名称"
      created_at:
        type: "string"
        format: "date-time"
        description: "创建时间"
  User:
    type: "object"
    required:
      - "id"
      - "name"
      - "role_name"
      - "status"
    properties:
      id:
        type: "integer"
        format: "int64"
        example: 1001
        description: "用户 ID"
      name:
        type: "string"
        example: "Alice"
        description: "用户姓名"
      role_name:
        type: "string"
        enum:
          - "sales"
          - "consultant"
          - "admin"
          - "super_admin"
        description: "用户角色"
      phone:
        type: "string"
        example: "13800138000"
        description: "手机号"
      email:
        type: "string"
        example: "alice@example.com"
        description: "邮箱"
      status:
        type: "string"
        enum:
          - "active"
          - "inactive"
        description: "用户状态"
      last_login_at:
        type: "string"
        format: "date-time"
        description: "最后登录时间"
      created_at:
        type: "string"
        format: "date-time"
        description: "创建时间"
      updated_at:
        type: "string"
        format: "date-time"
        description: "更新时间"
  Customer:
    type: "object"
    required:
      - "id"
      - "name"
      - "owner_user_id"
      - "customer_status"
    properties:
      id:
        type: "integer"
        format: "int64"
        description: "客户 ID"
      name:
        type: "string"
        example: "Bob"
        description: "客户姓名"
      phone:
        type: "string"
        description: "手机号（咨询师角色下屏蔽）"
        example: "138****8000"
      wechat:
        type: "string"
        description: "微信号（咨询师角色下屏蔽）"
        example: "wx****123"
      company_name:
        type: "string"
        example: "Example Corp"
        description: "公司名称"
      industry:
        type: "string"
        example: "Education"
        description: "行业"
      source_channel:
        type: "string"
        example: "Douyin"
        description: "来源渠道"
      owner_user_id:
        type: "integer"
        format: "int64"
        description: "负责人用户 ID"
      customer_status:
        type: "string"
        enum:
          - "potential"
          - "interested"
          - "converted"
          - "lost"
        description: "客户状态"
      tags:
        type: "array"
        items:
          $ref: "#/definitions/Tag"
        description: "客户标签列表"
      last_followup_at:
        type: "string"
        format: "date-time"
        description: "最后跟进时间"
      next_followup_at:
        type: "string"
        format: "date-time"
        description: "下次跟进时间"
      created_at:
        type: "string"
        format: "date-time"
        description: "创建时间"
      updated_at:
        type: "string"
        format: "date-time"
        description: "更新时间"
  Tag:
    type: "object"
    required:
      - "id"
      - "tag_name"
      - "tag_type"
    properties:
      id:
        type: "integer"
        format: "int64"
      tag_name:
        type: "string"
        example: "renewal-risk"
      tag_type:
        type: "string"
        enum:
          - "sales"
          - "consultant"
  Followup:
    type: "object"
    required:
      - "id"
      - "customer_id"
      - "sales_id"
      - "followup_time"
      - "contact_method"
      - "content"
    properties:
      id:
        type: "integer"
        format: "int64"
      customer_id:
        type: "integer"
        format: "int64"
      sales_id:
        type: "integer"
        format: "int64"
      followup_time:
        type: "string"
        format: "date-time"
      contact_method:
        type: "string"
        example: "phone"
      content:
        type: "string"
      result:
        type: "string"
        enum:
          - "no_answer"
          - "contacted"
          - "interested"
          - "rejected"
          - "pending"
      next_action_time:
        type: "string"
        format: "date-time"
      created_at:
        type: "string"
