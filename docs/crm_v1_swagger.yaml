swagger: "2.0"
info:
  version: "1.0.0"
  title: "猫课 CRM API"
  description: |
    猫课客户关系管理系统 V1 版本的 Swagger 2.0 规范。
    本文档基于最新的 V1 PRD 和现有的 REST API 草稿生成。
    它是前端和后端开发的唯一真实来源。
host: "localhost:8000"
basePath: "/api/v1"
schemes:
  - "http"
consumes:
  - "application/json"
produces:
  - "application/json"
tags:
  - name: "Authentication"
    description: "登录和当前用户信息 API"
  - name: "Roles"
    description: "角色元数据 API"
  - name: "Users"
    description: "用户管理 API"
  - name: "Customers"
    description: "客户主数据 API"
  - name: "Tags"
    description: "客户标签 API"
  - name: "Followups"
    description: "销售跟进 API"
  - name: "Opportunities"
    description: "销售机会 API"
  - name: "Services"
    description: "咨询师服务和咨询分析 API"
  - name: "Reminders"
    description: "提醒 API"
  - name: "Imports"
    description: "批量导入 API"
  - name: "Timeline"
    description: "统一客户时间线 API"
  - name: "Audit"
    description: "审计日志 API"
  - name: "System"
    description: "健康和就绪检查 API"
securityDefinitions:
  BearerAuth:
    type: "apiKey"
    name: "Authorization"
    in: "header"
    description: "Use `Bearer <token>`."
security:
  - BearerAuth: []
parameters:
  PageParam:
    name: "page"
    in: "query"
    type: "integer"
    format: "int32"
    minimum: 1
    default: 1
    description: "Page number, starting from 1."
  PageSizeParam:
    name: "page_size"
    in: "query"
    type: "integer"
    format: "int32"
    minimum: 1
    maximum: 100
    default: 20
    description: "Page size."
  KeywordParam:
    name: "keyword"
    in: "query"
    type: "string"
    description: "Fuzzy search keyword."
  UserIdParam:
    name: "userId"
    in: "path"
    required: true
    type: "integer"
    format: "int64"
    description: "User ID."
  CustomerIdParam:
    name: "customerId"
    in: "path"
    required: true
    type: "integer"
    format: "int64"
    description: "Customer ID."
  TagIdParam:
    name: "tagId"
    in: "path"
    required: true
    type: "integer"
    format: "int64"
    description: "Tag ID."
  FollowupIdParam:
    name: "followupId"
    in: "path"
    required: true
    type: "integer"
    format: "int64"
    description: "Follow-up ID."
  OpportunityIdParam:
    name: "opportunityId"
    in: "path"
    required: true
    type: "integer"
    format: "int64"
    description: "Opportunity ID."
  ServiceRecordIdParam:
    name: "recordId"
    in: "path"
    required: true
    type: "integer"
    format: "int64"
    description: "Service record ID."
  ConsultationAnalysisIdParam:
    name: "analysisId"
    in: "path"
    required: true
    type: "integer"
    format: "int64"
    description: "Consultation analysis ID."
  ReminderIdParam:
    name: "reminderId"
    in: "path"
    required: true
    type: "integer"
    format: "int64"
    description: "Reminder ID."
  BatchNoParam:
    name: "batchNo"
    in: "path"
    required: true
    type: "string"
    description: "Import batch number."
responses:
  Unauthorized:
    description: "Unauthorized."
    schema:
      $ref: "#/definitions/ErrorResponse"
  Forbidden:
    description: "Forbidden."
    schema:
      $ref: "#/definitions/ErrorResponse"
  NotFound:
    description: "Resource not found."
    schema:
      $ref: "#/definitions/ErrorResponse"
  ValidationError:
    description: "Validation failed."
    schema:
      $ref: "#/definitions/ValidationErrorResponse"
paths:
  /auth/login:
    post:
      tags:
        - "Authentication"
      summary: "用户登录"
      description: "使用账号和密码进行身份验证，然后返回访问令牌和用户资料。"
      operationId: "login"
      security: []
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/LoginRequest"
      responses:
        "200":
          description: "登录成功。"
          schema:
            $ref: "#/definitions/LoginResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "422":
          $ref: "#/responses/ValidationError"
  /auth/refresh:
    post:
      tags:
        - "Authentication"
      summary: "刷新访问令牌"
      operationId: "refreshToken"
      security: []
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/RefreshTokenRequest"
      responses:
        "200":
          description: "令牌已刷新。"
          schema:
            $ref: "#/definitions/RefreshTokenResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "422":
          $ref: "#/responses/ValidationError"
  /auth/logout:
    post:
      tags:
        - "Authentication"
      summary: "用户登出"
      operationId: "logout"
      responses:
        "200":
          description: "登出成功。"
          schema:
            $ref: "#/definitions/SuccessResponse"
        "401":
          $ref: "#/responses/Unauthorized"
  /auth/me:
    get:
      tags:
        - "Authentication"
      summary: "获取当前用户信息"
      operationId: "getCurrentUser"
      responses:
        "200":
          description: "当前用户资料。"
          schema:
            $ref: "#/definitions/UserResponse"
        "401":
          $ref: "#/responses/Unauthorized"
  /roles:
    get:
      tags:
        - "Roles"
      summary: "列出角色"
      operationId: "listRoles"
      x-permissions:
        - "admin"
        - "super_admin"
      responses:
        "200":
          description: "角色列表。"
          schema:
            $ref: "#/definitions/RoleListResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
  /users:
    get:
      tags:
        - "Users"
      summary: "列出用户"
      operationId: "listUsers"
      x-permissions:
        - "admin"
        - "super_admin"
      parameters:
        - $ref: "#/parameters/PageParam"
        - $ref: "#/parameters/PageSizeParam"
        - $ref: "#/parameters/KeywordParam"
        - name: "role_name"
          in: "query"
          type: "string"
          enum:
            - "sales"
            - "consultant"
            - "admin"
            - "super_admin"
        - name: "status"
          in: "query"
          type: "string"
          enum:
            - "active"
            - "inactive"
      responses:
        "200":
          description: "用户列表。"
          schema:
            $ref: "#/definitions/UserListResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
    post:
      tags:
        - "Users"
      summary: "创建用户"
      description: "管理员可以创建销售和咨询师用户。超级管理员可以额外创建管理员用户。"
      operationId: "createUser"
      x-permissions:
        - "admin"
        - "super_admin"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/UserCreateRequest"
      responses:
        "201":
          description: "用户已创建。"
          schema:
            $ref: "#/definitions/UserResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "422":
          $ref: "#/responses/ValidationError"
  /users/{userId}:
    get:
      tags:
        - "Users"
      summary: "Get user detail"
      operationId: "getUser"
      x-permissions:
        - "admin"
        - "super_admin"
      parameters:
        - $ref: "#/parameters/UserIdParam"
      responses:
        "200":
          description: "User detail."
          schema:
            $ref: "#/definitions/UserResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
    patch:
      tags:
        - "Users"
      summary: "Update user"
      operationId: "updateUser"
      x-permissions:
        - "admin"
        - "super_admin"
      parameters:
        - $ref: "#/parameters/UserIdParam"
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/UserUpdateRequest"
      responses:
        "200":
          description: "User updated."
          schema:
            $ref: "#/definitions/UserResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "422":
          $ref: "#/responses/ValidationError"
    delete:
      tags:
        - "Users"
      summary: "Delete user"
      description: "Soft delete."
      operationId: "deleteUser"
      x-permissions:
        - "super_admin"
      parameters:
        - $ref: "#/parameters/UserIdParam"
      responses:
        "200":
          description: "User deleted."
          schema:
            $ref: "#/definitions/SuccessResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
  /users/{userId}/status:
    patch:
      tags:
        - "Users"
      summary: "Update user status"
      operationId: "updateUserStatus"
      x-permissions:
        - "admin"
        - "super_admin"
      parameters:
        - $ref: "#/parameters/UserIdParam"
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/UserStatusPatchRequest"
      responses:
        "200":
          description: "User status updated."
          schema:
            $ref: "#/definitions/UserResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "422":
          $ref: "#/responses/ValidationError"
  /customers:
    get:
      tags:
        - "Customers"
      summary: "列出客户"
      description: |
        销售用户只能访问自己负责的客户。
        咨询师用户接收到屏蔽的手机号和微信值。
        管理员和超级管理员可以访问所有客户。
      operationId: "listCustomers"
      parameters:
        - $ref: "#/parameters/PageParam"
        - $ref: "#/parameters/PageSizeParam"
        - $ref: "#/parameters/KeywordParam"
        - name: "status"
          in: "query"
          type: "string"
          enum:
            - "potential"
            - "interested"
            - "converted"
            - "lost"
        - name: "owner_user_id"
          in: "query"
          type: "integer"
          format: "int64"
        - name: "source_channel"
          in: "query"
          type: "string"
        - name: "industry"
          in: "query"
          type: "string"
        - name: "tag_id"
          in: "query"
          type: "integer"
          format: "int64"
      responses:
        "200":
          description: "客户列表。"
          schema:
            $ref: "#/definitions/CustomerListResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
    post:
      tags:
        - "Customers"
      summary: "创建客户"
      operationId: "createCustomer"
      x-permissions:
        - "sales"
        - "admin"
        - "super_admin"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/CustomerCreateRequest"
      responses:
        "201":
          description: "客户已创建。"
          schema:
            $ref: "#/definitions/CustomerResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "422":
          $ref: "#/responses/ValidationError"
  /customers/{customerId}:
    get:
      tags:
        - "Customers"
      summary: "Get customer detail"
      operationId: "getCustomer"
      parameters:
        - $ref: "#/parameters/CustomerIdParam"
      responses:
        "200":
          description: "Customer detail."
          schema:
            $ref: "#/definitions/CustomerResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
    patch:
      tags:
        - "Customers"
      summary: "Update customer"
      operationId: "updateCustomer"
      x-permissions:
        - "sales"
        - "admin"
        - "super_admin"
      parameters:
        - $ref: "#/parameters/CustomerIdParam"
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/CustomerUpdateRequest"
      responses:
        "200":
          description: "Customer updated."
          schema:
            $ref: "#/definitions/CustomerResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "422":
          $ref: "#/responses/ValidationError"
    delete:
      tags:
        - "Customers"
      summary: "Delete customer"
      description: "Soft delete customer and write audit log."
      operationId: "deleteCustomer"
      x-permissions:
        - "admin"
        - "super_admin"
      parameters:
        - $ref: "#/parameters/CustomerIdParam"
      responses:
        "200":
          description: "Customer deleted."
          schema:
            $ref: "#/definitions/SuccessResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
  /customers/{customerId}/owner:
    patch:
      tags:
        - "Customers"
      summary: "Transfer customer owner"
      operationId: "transferCustomerOwner"
      x-permissions:
        - "admin"
        - "super_admin"
      parameters:
        - $ref: "#/parameters/CustomerIdParam"
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/CustomerOwnerPatchRequest"
      responses:
        "200":
          description: "Customer owner updated."
          schema:
            $ref: "#/definitions/CustomerResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "422":
          $ref: "#/responses/ValidationError"
  /customers/{customerId}/status:
    patch:
      tags:
        - "Customers"
      summary: "Update customer status"
      operationId: "updateCustomerStatus"
      x-permissions:
        - "sales"
        - "consultant"
        - "admin"
        - "super_admin"
      parameters:
        - $ref: "#/parameters/CustomerIdParam"
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/CustomerStatusPatchRequest"
      responses:
        "200":
          description: "Customer status updated."
          schema:
            $ref: "#/definitions/CustomerResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "422":
          $ref: "#/responses/ValidationError"
  /tags:
    get:
      tags:
        - "Tags"
      summary: "List tags"
      operationId: "listTags"
      parameters:
        - name: "tag_type"
          in: "query"
          type: "string"
          enum:
            - "sales"
            - "consultant"
      responses:
        "200":
          description: "Tag list."
          schema:
            $ref: "#/definitions/TagListResponse"
        "401":
          $ref: "#/responses/Unauthorized"
    post:
      tags:
        - "Tags"
      summary: "Create tag"
      operationId: "createTag"
      x-permissions:
        - "admin"
        - "super_admin"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/TagCreateRequest"
      responses:
        "201":
          description: "Tag created."
          schema:
            $ref: "#/definitions/TagResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "422":
          $ref: "#/responses/ValidationError"
  /tags/{tagId}:
    patch:
      tags:
        - "Tags"
      summary: "Update tag"
      operationId: "updateTag"
      x-permissions:
        - "admin"
        - "super_admin"
      parameters:
        - $ref: "#/parameters/TagIdParam"
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/TagUpdateRequest"
      responses:
        "200":
          description: "Tag updated."
          schema:
            $ref: "#/definitions/TagResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "422":
          $ref: "#/responses/ValidationError"
    delete:
      tags:
        - "Tags"
      summary: "Delete tag"
      operationId: "deleteTag"
      x-permissions:
        - "admin"
        - "super_admin"
      parameters:
        - $ref: "#/parameters/TagIdParam"
      responses:
        "200":
          description: "Tag deleted."
          schema:
            $ref: "#/definitions/SuccessResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
  /customers/{customerId}/tags:
    get:
      tags:
        - "Tags"
      summary: "Get customer tags"
      operationId: "getCustomerTags"
      parameters:
        - $ref: "#/parameters/CustomerIdParam"
      responses:
        "200":
          description: "Customer tags."
          schema:
            $ref: "#/definitions/CustomerTagListResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
    post:
      tags:
        - "Tags"
      summary: "Bind customer tags"
      operationId: "bindCustomerTags"
      x-permissions:
        - "sales"
        - "consultant"
        - "admin"
        - "super_admin"
      parameters:
        - $ref: "#/parameters/CustomerIdParam"
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/CustomerTagBindRequest"
      responses:
        "200":
          description: "Customer tags bound."
          schema:
            $ref: "#/definitions/CustomerTagListResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "422":
          $ref: "#/responses/ValidationError"
  /customers/{customerId}/followups:
    get:
      tags:
        - "Followups"
      summary: "按客户列出跟进记录"
      operationId: "listFollowupsByCustomer"
      parameters:
        - $ref: "#/parameters/CustomerIdParam"
        - $ref: "#/parameters/PageParam"
        - $ref: "#/parameters/PageSizeParam"
      responses:
        "200":
          description: "跟进记录列表。"
          schema:
            $ref: "#/definitions/FollowupListResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
    post:
      tags:
        - "Followups"
      summary: "创建跟进记录"
      operationId: "createFollowup"
      x-permissions:
        - "sales"
        - "admin"
        - "super_admin"
      parameters:
        - $ref: "#/parameters/CustomerIdParam"
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/FollowupCreateRequest"
      responses:
        "201":
          description: "跟进记录已创建。"
          schema:
            $ref: "#/definitions/FollowupResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "422":
          $ref: "#/responses/ValidationError"
  /followups/{followupId}:
    patch:
      tags:
        - "Followups"
      summary: "Update follow-up"
      operationId: "updateFollowup"
      parameters:
        - $ref: "#/parameters/FollowupIdParam"
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/FollowupUpdateRequest"
      responses:
        "200":
          description: "Follow-up updated."
          schema:
            $ref: "#/definitions/FollowupResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "422":
          $ref: "#/responses/ValidationError"
    delete:
      tags:
        - "Followups"
      summary: "Delete follow-up"
      operationId: "deleteFollowup"
      x-permissions:
        - "admin"
        - "super_admin"
      parameters:
        - $ref: "#/parameters/FollowupIdParam"
      responses:
        "200":
          description: "Follow-up deleted."
          schema:
            $ref: "#/definitions/SuccessResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
  /customers/{customerId}/opportunities:
    get:
      tags:
        - "Opportunities"
      summary: "按客户列出销售机会"
      operationId: "listOpportunitiesByCustomer"
      parameters:
        - $ref: "#/parameters/CustomerIdParam"
        - $ref: "#/parameters/PageParam"
        - $ref: "#/parameters/PageSizeParam"
      responses:
        "200":
          description: "销售机会列表。"
          schema:
            $ref: "#/definitions/OpportunityListResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
    post:
      tags:
        - "Opportunities"
      summary: "创建销售机会"
      operationId: "createOpportunity"
      x-permissions:
        - "sales"
        - "admin"
        - "super_admin"
      parameters:
        - $ref: "#/parameters/CustomerIdParam"
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/OpportunityCreateRequest"
      responses:
        "201":
          description: "销售机会已创建。"
          schema:
            $ref: "#/definitions/OpportunityResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
